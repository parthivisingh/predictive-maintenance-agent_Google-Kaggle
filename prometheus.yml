global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'maintenance-tools'
    static_configs:
      - targets: ['maintenance-tools:8000']
        labels:
          service: 'predictive-maintenance'
          environment: 'production'
    metrics_path: '/metrics'
    scrape_interval: 10s
